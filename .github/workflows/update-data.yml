name: Update Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run basic data updater
        run: python scripts/update_data.py

      - name: Test Game8 access
        run: python scripts/fetch_game8_test.py

      - name: Test Game8 single team extraction
        run: python scripts/extract_game8_team_test.py

      - name: Extract all Game8 teams
        run: python scripts/extract_game8_all_teams.py

      - name: Test Icy Veins access
        run: python scripts/fetch_icyveins_test.py

      - name: Test Icy Veins single team extraction
        run: python scripts/extract_icyveins_team_test.py

      - name: Extract all Icy Veins Miyabi teams
        run: python scripts/extract_icyveins_all_teams.py

      - name: Extract Icy Veins Miyabi synergy
        run: python scripts/extract_icyveins_synergy.py

      - name: Discover Icy Veins team pages
        run: python scripts/discover_icyveins_team_pages.py

      - name: Check Icy Veins team pages
        run: python scripts/check_icyveins_team_pages.py

      - name: Extract all Icy Veins character teams
        run: python scripts/extract_icyveins_all_character_teams.py

      - name: Summarize Icy Veins warnings
        run: python scripts/summarize_icyveins_warnings.py

      - name: Extract all Icy Veins character synergy
        run: python scripts/extract_icyveins_all_synergy.py

      - name: Summarize Icy Veins synergy issues
        run: python scripts/summarize_icyveins_synergy_issues.py

      - name: Build normalized team database
        run: python scripts/build_teams.py

      - name: Build normalized synergy database
        run: python scripts/build_synergy.py

      - name: Enrich synergy data
        run: python scripts/enrich_synergy.py

      - name: Validate release data
        run: python scripts/validate_release.py

      - name: Update manifest
        run: python scripts/update_manifest.py

      - name: Commit generated data
        run: |
          git config user.name "MAA-Fairy Bot"
          git config user.email "maa-fairy-bot@users.noreply.github.com"

          git add manifest.json
          git add data/automation_test.json
          git add data/sources/game8_smoke.json
          git add data/sources/game8_team_test.json
          git add data/sources/game8_all_teams.json
          git add data/sources/icyveins_smoke.json
          git add data/sources/icyveins_team_test.json
          git add data/sources/icyveins_all_teams.json
          git add data/sources/icyveins_synergy_miyabi.json
          git add data/sources/icyveins_team_pages.json
          git add data/sources/icyveins_team_page_status.json
          git add data/sources/icyveins_all_character_teams.json
          git add data/sources/icyveins_warning_summary.json
          git add data/sources/icyveins_all_character_synergy.json
          git add data/sources/icyveins_synergy_issue_summary.json
          git add data/teams.json
          git add data/synergy.json

          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Auto update guide data"
            git push
          fi
