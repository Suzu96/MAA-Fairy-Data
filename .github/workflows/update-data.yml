name: Update Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run basic data updater
        run: python scripts/update_data.py

      - name: Test Game8 access
        run: python scripts/fetch_game8_test.py

      - name: Test Game8 team extraction
        run: python scripts/extract_game8_team_test.py

      - name: Commit generated data
        run: |
          git config user.name "MAA-Fairy Bot"
          git config user.email "maa-fairy-bot@users.noreply.github.com"

          git add data/automation_test.json
          git add data/sources/game8_smoke.json
          git add data/sources/game8_team_test.json

          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Auto update data"
            git push
          fi
